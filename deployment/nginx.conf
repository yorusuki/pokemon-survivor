log_format ps_safe escape=json '{"event":"http_request","method":"$request_method","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $api_backend api:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 768k;
    server_tokens off;
    access_log /var/log/nginx/access.log ps_safe;
    client_body_timeout 10s;
    client_header_timeout 10s;
    include /etc/nginx/security-headers.conf;
    # 由啟動腳本只加入 cloudflared 直連子網；同網路容器必須可信。
    include /etc/nginx/trusted-proxies.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://$api_backend;
    }
    location = /api/auth/google/callback {
        # upstream 錯誤可能帶入完整 callback query；此路徑不記錄原始錯誤。
        error_log /dev/null crit;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-PS-Client-IP $remote_addr;
        proxy_set_header X-PS-Proxy-Token "${API_PROXY_SECRET}";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 20s;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-PS-Client-IP $remote_addr;
        proxy_set_header X-PS-Proxy-Token "${API_PROXY_SECRET}";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        proxy_read_timeout 20s;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /oauth-result.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~ (^|/)\. { deny all; }
    location ~* \.(html|json|js|webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    gzip on;
    gzip_types text/css application/javascript application/json;
}
