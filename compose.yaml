name: pokesurvivor
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokesurvivor
      POSTGRES_USER: pokesurvivor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 768m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokesurvivor -d pokesurvivor"]
      interval: 5s
      timeout: 3s
      retries: 20
  db-init:
    build:
      context: .
      target: api
    command: ["node", "bootstrap.js"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pokesurvivor
      PGUSER: pokesurvivor
      PGPASSWORD: ${POSTGRES_PASSWORD:?請設定初始化密碼}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?請設定獨立 API 資料庫密碼}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 50
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pokesurvivor
      PGUSER: pokesurvivor_app
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?請設定獨立 API 資料庫密碼}
      API_PROXY_SECRET: ${API_PROXY_SECRET:?請設定內部代理驗證 secret}
      APP_ORIGIN: ${APP_ORIGIN:?請設定實際網站 origin}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      TURN_CREDENTIALS_PER_HOUR: ${TURN_CREDENTIALS_PER_HOUR:-300}
      GAME_EVENT_BOOST_ENABLED: ${GAME_EVENT_BOOST_ENABLED:-false}
      REGISTRATIONS_PER_HOUR: ${REGISTRATIONS_PER_HOUR:-100}
      NODE_ENV: production
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [database, application, outbound]
    read_only: true
    mem_limit: 512m
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  pokesurvivor-web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      API_PROXY_SECRET: ${API_PROXY_SECRET:?請設定內部代理驗證 secret}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks:
      application:
      cloudflared:
        gw_priority: 100
        aliases: [pokesurvivor-web]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  cloudflared:
    external: true
  database:
    internal: true
  application:
    internal: true
  outbound:
volumes:
  postgres-data:
